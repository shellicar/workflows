name: Test

# TODO(claude): undecided: whether the logic tests run in CI, and whether under BusyBox sh in Docker as well as the runner's sh. Both, for now.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-24.04
    steps:
      # TODO(claude): undecided: whether third-party actions here are pinned by full commit hash (as here) or by major tag, as the other repos' workflows do.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Logic tests (dash)
        run: sh tests/run-logic-tests.sh

      - name: Logic tests (BusyBox sh)
        run: docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh /w/tests/docker-entry.sh
