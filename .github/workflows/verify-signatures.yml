name: Verify Signatures

# This repository's own pull requests are checked by the reusable workflow it
# provides. The check is reported as "verify-signatures / verify".
# TODO(claude): undecided: whether this repository calls its own workflow locally (as here, so a pull request is checked by the verifier it contains) or pinned to a commit on main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-signatures:
    uses: ./.github/workflows/verify-commit-signatures.yml
