name: Verify Signatures

# This repository's own pull requests are checked by the reusable workflow it
# provides, called locally so a pull request is checked by the verifier it
# contains. The check is reported as "verify-signatures / verify".

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-signatures:
    uses: ./.github/workflows/verify-commit-signatures.yml
